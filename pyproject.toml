[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontem-events"
version = "0.3.0"
description = "Runtime client lib for the fontem event log."
requires-python = ">=3.11"
authors = [{ name = "Fontem", email = "ops@void42.internal" }]
license = { text = "Internal-only" }
dependencies = [
    "psycopg[binary]>=3.3.4",
    "prometheus-client>=0.24.1",
    "fontem-event-schemas>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "psycopg-pool"]

[tool.setuptools.packages.find]
include = ["fontem_events*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
