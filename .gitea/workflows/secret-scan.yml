# Fails a pull request that adds a secret.
#
# Scans the commits the pull request adds (base..head), not just the final
# tree: a credential committed and deleted again two commits later is still
# in the history, and still leaked once this branch is merged or mirrored.
# Anything already on main before this check existed is out of range and
# does not block.
#
# A finding that is genuinely not a secret (a test fixture, a public token):
# add its fingerprint — printed in the job log — to .gitleaksignore, or an
# allowlist to .gitleaks.toml. Both are read from the repository root.
name: Secret scan

on:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-pinned)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${TARBALL}" \
            "https://nexus.void42.internal/repository/github-releases/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          echo "${SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin gitleaks

      - name: Scan the commits this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          echo "Scanning ${BASE_SHA}..${HEAD_SHA}"
          gitleaks git . --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --verbose --exit-code 1
